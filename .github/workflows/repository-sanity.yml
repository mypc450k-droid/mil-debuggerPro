name: Repository sanity

on:
  push:
  pull_request:

jobs:
  sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check project structure
        run: |
          test -f MILDebuggerPro.m
          test -f MILDebuggerProApp.m
          test -d "+mildebug"
          test -d tests
          test -f docs/R2024B_API_NOTES.md
          echo "Structure OK. MATLAB execution requires licensed MATLAB R2024b."
